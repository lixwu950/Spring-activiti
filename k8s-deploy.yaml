apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-activiti
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-activiti
  template:
    metadata:
      labels:
        app: spring-activiti
    spec:
      containers:
        - name: spring-activiti
          image: spring-activiti:latest
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: spring-activiti-service
spec:
  type: NodePort
  selector:
    app: spring-activiti
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30088
